      .rotate-feet {
        transform-box: fill-box;
        transform-origin: bottom right;
        animation: rotate-feet-ani 2s ease-in-out infinite;
      }
      @keyframes rotate-feet-ani {
        0%{
          transform: rotate(-3deg);
        }
        50%{
          transform: rotate(3deg);
        }
        100%{
          transform: rotate(-3deg);
        }
      }
      .rotate {
        transform-box: fill-box;
        transform-origin: center top;
        animation: rotate-ani 2s ease-in-out infinite;
      }
      @keyframes rotate-ani {
        0%{
          transform: rotate(-5deg);
        }
        50%{
          transform: rotate(5deg);
        }
        100%{
          transform: rotate(-5deg);
        }
      }
      .square {
        transform-box: fill-box;
        transform-origin: center center;
        animation: square-ani 2s ease-in-out infinite;
        transform: scale(1.1, 1.1);
      }
      @keyframes square-ani {
        0%{
          transform: scale(1.1, 1.1);
        }
        50%{
          transform: scale(1, 1);
        }
        100%{
          transform: scale(1.1, 1.1);
        }
      }
      .tooltips {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: tooltips-ani 1s ease-in-out infinite;
      }
      @keyframes tooltips-ani {
        0%{
          transform: translateY(0px)
        }
        50%{
          transform: translateY(-3px)
        }
        100%{
          transform: translateY(0px)
        }
      }

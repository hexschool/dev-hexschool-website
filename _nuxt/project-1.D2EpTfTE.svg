      .line {
        transform-box: fill-box;
        transform-origin: center;
        animation: line-ani 2s ease-in-out infinite;
      }
      @keyframes line-ani {
        0%{
          transform: scaleY(0.8);
        }
        50%{
          transform: scaleY(1);
        }
        100%{
          transform: scaleY(0.8);
        }
      }
      .square {
        transform-box: fill-box;
        transform-origin: left bottom;
        animation: square-ani 2s ease-in-out infinite;
      }
      @keyframes square-ani {
        0%{
          transform: scale(1, 1);
        }
        50%{
          transform: scale(1.2, 1.2);
        }
        100%{
          transform: scale(1, 1);
        }
      }
      .rotate {
        transform-box: fill-box;
        transform-origin: center top;
        animation: rotate-ani 2s ease-in-out infinite;
      }
      @keyframes rotate-ani {
        0%{
          transform: rotate(-5deg);
        }
        50%{
          transform: rotate(5deg);
        }
        100%{
          transform: rotate(-5deg);
        }
      }
      .position {
        transform-box: fill-box;
        transform-origin: center top;
        animation: position-ani 2s ease-in-out infinite;
      }
      @keyframes position-ani {
        0%{
          transform: translateY(-5px);
        }
        50%{
          transform: translateY(5px);
        }
        100%{
          transform: translateY(-5px);
        }
      }
      .position-reverse {
        transform-box: fill-box;
        transform-origin: center top;
        animation: position-reverse-ani 2s ease-in-out infinite;
      }
      @keyframes position-reverse-ani {
        0%{
          transform: translateY(5px);
        }
        50%{
          transform: translateY(-5px);
        }
        100%{
          transform: translateY(5px);
        }
      }
      .rotate-feet {
        transform-box: fill-box;
        transform-origin: center top;
        animation: rotate-feet-ani 2s ease-in-out infinite;
      }
      @keyframes rotate-feet-ani {
        0%{
          transform: rotate(-3deg);
        }
        50%{
          transform: rotate(3deg);
        }
        100%{
          transform: rotate(-3deg);
        }
      }
    </style>
